services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "my-secret-pw"]
    ports:
      - "6379:6379"

  web:
    build: .
    depends_on:
      - redis
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: my-secret-pw
    ports:
      - "5003:5003"